[project]
name = "vaultcore-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dhanush Mohanasundaram", email = "dhanushprofessional7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
vaultcore-backend = "vaultcore_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
